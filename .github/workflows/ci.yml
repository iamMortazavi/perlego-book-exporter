name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify, Test & Pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run manifest & syntax checks
        run: npm run check

      - name: Run unit and EPUB 3 XML validation tests
        run: npm test

      - name: Pack extension archive
        run: npm run pack

      - name: Verify packed extension archive
        run: unzip -t dist/perlego-book-exporter-*.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: perlego-book-exporter-extension
          path: dist/perlego-book-exporter-*.zip
          retention-days: 14
